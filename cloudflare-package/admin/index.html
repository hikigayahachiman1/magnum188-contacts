<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Panel Kontak MAGNUM188</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080709;
      --panel: rgba(25, 17, 19, .88);
      --panel-2: rgba(255, 255, 255, .045);
      --line: rgba(255, 255, 255, .105);
      --text: #fff8f2;
      --muted: #b9abad;
      --gold: #f3d06c;
      --red: #ef2938;
      --green: #25d366;
      --shadow: 0 24px 70px rgba(0, 0, 0, .45);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 5%, rgba(239, 41, 56, .22), transparent 30%),
        radial-gradient(circle at 85% 95%, rgba(243, 208, 108, .10), transparent 28%),
        linear-gradient(155deg, #180609, var(--bg) 56%, #100507);
    }

    button, input { font: inherit; }
    button { cursor: pointer; }
    [hidden] { display: none !important; }

    .shell { width: min(1120px, calc(100% - 28px)); margin: 0 auto; padding: 34px 0 46px; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 22px;
    }

    .brand { display: flex; align-items: center; gap: 12px; }

    .mark {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      border: 1px solid rgba(243, 208, 108, .42);
      border-radius: 15px;
      color: var(--gold);
      background: linear-gradient(145deg, rgba(239, 41, 56, .32), rgba(255, 255, 255, .04));
      box-shadow: 0 12px 30px rgba(239, 41, 56, .18);
      font-weight: 900;
      font-size: 22px;
    }

    h1 { margin: 0; font-size: clamp(19px, 3vw, 27px); letter-spacing: -.02em; }
    .subtitle { margin: 4px 0 0; color: var(--muted); font-size: 13px; }

    .panel {
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .login {
      width: min(440px, 100%);
      margin: 9vh auto 0;
      padding: 30px;
    }

    .login h2 { margin: 0 0 8px; font-size: 24px; }
    .login p { margin: 0 0 24px; color: var(--muted); line-height: 1.55; font-size: 14px; }

    label.field-label { display: block; margin: 0 0 8px; color: #e8dcdd; font-size: 13px; font-weight: 700; }

    input[type="password"], input[type="url"] {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 13px;
      outline: 0;
      color: var(--text);
      background: rgba(0, 0, 0, .28);
      transition: border-color .18s, box-shadow .18s;
    }

    input[type="password"] { height: 48px; padding: 0 14px; }
    input[type="url"] { min-height: 44px; padding: 10px 12px; font-size: 13px; }

    input:focus {
      border-color: rgba(243, 208, 108, .56);
      box-shadow: 0 0 0 4px rgba(243, 208, 108, .09);
    }

    .primary, .secondary, .danger, .test-button {
      border: 1px solid transparent;
      border-radius: 13px;
      color: #fff;
      font-weight: 800;
      transition: transform .16s, opacity .16s, border-color .16s;
    }

    button:hover { transform: translateY(-1px); }
    button:disabled { cursor: wait; opacity: .58; transform: none; }

    .primary {
      min-height: 48px;
      padding: 0 20px;
      background: linear-gradient(135deg, #ff3a48, #c90f2c);
      box-shadow: 0 12px 28px rgba(239, 41, 56, .23);
    }

    .login .primary { width: 100%; margin-top: 16px; }

    .secondary, .danger { min-height: 42px; padding: 0 16px; background: rgba(255, 255, 255, .055); border-color: var(--line); }
    .danger { color: #ff9aa2; }

    .dashboard { padding: 24px; }

    .dashboard-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    .dashboard-head h2 { margin: 0 0 6px; font-size: 20px; }
    .dashboard-head p { margin: 0; color: var(--muted); font-size: 13px; }

    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }

    .contact-card {
      padding: 17px;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: var(--panel-2);
      transition: border-color .18s, opacity .18s;
    }

    .contact-card.inactive { opacity: .72; border-color: rgba(255, 255, 255, .07); }

    .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 13px; }
    .service { display: flex; align-items: center; gap: 10px; min-width: 0; }

    .service-icon {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 12px;
      color: #fff;
      font-size: 11px;
      font-weight: 900;
      background: linear-gradient(145deg, #ef3948, #9e1028);
    }

    .service-name { margin: 0; font-size: 14px; }
    .status-text { margin: 3px 0 0; color: var(--green); font-size: 11px; font-weight: 800; text-transform: uppercase; }
    .inactive .status-text { color: #a99da0; }

    .switch { position: relative; width: 48px; height: 27px; flex: 0 0 auto; }
    .switch input { position: absolute; opacity: 0; pointer-events: none; }
    .slider { position: absolute; inset: 0; border-radius: 999px; background: #4d4547; transition: .2s; }
    .slider::after { content: ""; position: absolute; width: 21px; height: 21px; left: 3px; top: 3px; border-radius: 50%; background: #fff; transition: .2s; box-shadow: 0 3px 9px rgba(0,0,0,.35); }
    .switch input:checked + .slider { background: var(--green); }
    .switch input:checked + .slider::after { transform: translateX(21px); }

    .url-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
    .test-button { min-width: 68px; padding: 0 12px; color: var(--gold); background: rgba(243, 208, 108, .08); border-color: rgba(243, 208, 108, .22); }

    .allowed { margin: 8px 2px 0; color: #8e8284; font-size: 10px; line-height: 1.4; }

    .footer-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .updated { color: var(--muted); font-size: 12px; }
    .footer-buttons { display: flex; gap: 9px; }

    .message { min-height: 20px; margin: 12px 0 0; color: #ff9ba4; font-size: 13px; }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      max-width: min(390px, calc(100% - 36px));
      padding: 13px 16px;
      border: 1px solid rgba(97, 255, 153, .28);
      border-radius: 13px;
      color: #dffff0;
      background: rgba(11, 54, 31, .96);
      box-shadow: var(--shadow);
      font-size: 13px;
      transform: translateY(120px);
      opacity: 0;
      transition: .25s;
      z-index: 10;
    }

    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.error { color: #ffe3e5; border-color: rgba(255, 90, 104, .3); background: rgba(76, 13, 22, .97); }

    @media (max-width: 760px) {
      .shell { padding-top: 20px; }
      .grid { grid-template-columns: 1fr; }
      .dashboard { padding: 17px; }
      .dashboard-head, .footer-actions { flex-direction: column; align-items: stretch; }
      .footer-buttons { display: grid; grid-template-columns: 1fr 1.5fr; }
      .topbar .subtitle { display: none; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="mark" aria-hidden="true">M</div>
        <div>
          <h1>Panel Kontak MAGNUM188</h1>
          <p class="subtitle">Kelola link dan status layanan resmi</p>
        </div>
      </div>
    </header>

    <section id="loginView" class="panel login" hidden>
      <h2>Login Admin</h2>
      <p>Masukkan password admin. Password tidak disimpan di browser maupun di dalam HTML.</p>
      <form id="loginForm">
        <label class="field-label" for="password">Password</label>
        <input id="password" name="password" type="password" minlength="10" autocomplete="current-password" required>
        <button id="loginButton" class="primary" type="submit">Masuk ke Panel</button>
        <div id="loginMessage" class="message" role="alert"></div>
      </form>
    </section>

    <section id="dashboardView" class="panel dashboard" hidden>
      <div class="dashboard-head">
        <div>
          <h2>Pengaturan Kontak</h2>
          <p>Perubahan akan disimpan langsung ke sistem kontak website.</p>
        </div>
        <button id="refreshButton" class="secondary" type="button">Muat Ulang</button>
      </div>

      <form id="contactsForm">
        <div id="contactsGrid" class="grid"></div>
        <div class="footer-actions">
          <div id="updatedText" class="updated">Belum ada informasi pembaruan.</div>
          <div class="footer-buttons">
            <button id="logoutButton" class="danger" type="button">Logout</button>
            <button id="saveButton" class="primary" type="submit">Simpan Perubahan</button>
          </div>
        </div>
      </form>
    </section>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <script>
    "use strict";

    const services = [
      { key: "whatsapp", label: "WhatsApp Official", short: "WA", allowed: "wa.me, api.whatsapp.com, pasticuan.me" },
      { key: "telegram", label: "Telegram Official", short: "TG", allowed: "t.me, telegram.me, pasticuan.me" },
      { key: "livechat", label: "LiveChat Official", short: "LC", allowed: "direct.lc.chat, pasticuan.me" },
      { key: "whatsapp_group", label: "Grup WhatsApp", short: "WG", allowed: "chat.whatsapp.com, pasticuan.me" },
      { key: "telegram_group", label: "Grup Telegram", short: "GT", allowed: "t.me, telegram.me, pasticuan.me" },
      { key: "facebook_group", label: "Grup Facebook", short: "FB", allowed: "facebook.com, pasticuan.me" }
    ];

    const loginView = document.getElementById("loginView");
    const dashboardView = document.getElementById("dashboardView");
    const loginForm = document.getElementById("loginForm");
    const contactsForm = document.getElementById("contactsForm");
    const contactsGrid = document.getElementById("contactsGrid");
    const loginMessage = document.getElementById("loginMessage");
    const loginButton = document.getElementById("loginButton");
    const saveButton = document.getElementById("saveButton");
    const refreshButton = document.getElementById("refreshButton");
    const logoutButton = document.getElementById("logoutButton");
    const updatedText = document.getElementById("updatedText");
    const toast = document.getElementById("toast");
    let toastTimer;

    function showToast(message, isError) {
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.toggle("error", Boolean(isError));
      toast.classList.add("show");
      toastTimer = setTimeout(() => toast.classList.remove("show"), 3500);
    }

    function setView(loggedIn) {
      loginView.hidden = loggedIn;
      dashboardView.hidden = !loggedIn;
      if (!loggedIn) document.getElementById("password").focus();
    }

    async function api(action, options) {
      const response = await fetch(`/api/admin?action=${encodeURIComponent(action)}`, {
        credentials: "same-origin",
        cache: "no-store",
        ...options
      });
      let data = {};
      try { data = await response.json(); } catch (_) {}
      return { response, data };
    }

    function renderContacts(contacts) {
      contactsGrid.textContent = "";
      for (const service of services) {
        const value = contacts[service.key] || { url: "", active: false };
        const card = document.createElement("article");
        card.className = `contact-card${value.active ? "" : " inactive"}`;
        card.dataset.key = service.key;

        const head = document.createElement("div");
        head.className = "card-head";
        head.innerHTML = `
          <div class="service">
            <div class="service-icon" aria-hidden="true">${service.short}</div>
            <div><h3 class="service-name">${service.label}</h3><p class="status-text">${value.active ? "Aktif" : "Nonaktif"}</p></div>
          </div>`;

        const switchLabel = document.createElement("label");
        switchLabel.className = "switch";
        switchLabel.title = `Aktif/nonaktif ${service.label}`;
        const toggle = document.createElement("input");
        toggle.type = "checkbox";
        toggle.checked = Boolean(value.active);
        toggle.dataset.role = "active";
        toggle.setAttribute("aria-label", `Status ${service.label}`);
        const slider = document.createElement("span");
        slider.className = "slider";
        switchLabel.append(toggle, slider);
        head.appendChild(switchLabel);

        const row = document.createElement("div");
        row.className = "url-row";
        const input = document.createElement("input");
        input.type = "url";
        input.value = value.url || "";
        input.placeholder = "https://...";
        input.autocomplete = "off";
        input.spellcheck = false;
        input.dataset.role = "url";
        input.setAttribute("aria-label", `Link ${service.label}`);
        const test = document.createElement("button");
        test.className = "test-button";
        test.type = "button";
        test.textContent = "Tes";
        test.addEventListener("click", () => {
          const target = input.value.trim();
          if (!target) return showToast("Isi link terlebih dahulu.", true);
          try {
            const url = new URL(target);
            if (url.protocol !== "https:") throw new Error();
            window.open(url.toString(), "_blank", "noopener,noreferrer");
          } catch (_) {
            showToast("Format link harus menggunakan https://", true);
          }
        });
        row.append(input, test);

        const allowed = document.createElement("p");
        allowed.className = "allowed";
        allowed.textContent = `Domain diizinkan: ${service.allowed}`;

        toggle.addEventListener("change", () => {
          card.classList.toggle("inactive", !toggle.checked);
          card.querySelector(".status-text").textContent = toggle.checked ? "Aktif" : "Nonaktif";
        });

        card.append(head, row, allowed);
        contactsGrid.appendChild(card);
      }
    }

    function updateTimestamp(value) {
      if (!value) {
        updatedText.textContent = "Belum ada informasi pembaruan.";
        return;
      }
      const date = new Date(value);
      updatedText.textContent = `Terakhir diperbarui: ${date.toLocaleString("id-ID", { dateStyle: "medium", timeStyle: "medium" })}`;
    }

    async function loadContacts(showMessage) {
      refreshButton.disabled = true;
      try {
        const { response, data } = await api("contacts", { method: "GET" });
        if (response.status === 401) {
          setView(false);
          return;
        }
        if (!response.ok) throw new Error(data.message || "Panel admin belum dikonfigurasi.");
        renderContacts(data.contacts || {});
        updateTimestamp(data.updatedAt);
        setView(true);
        if (showMessage) showToast("Data terbaru berhasil dimuat.");
      } catch (error) {
        setView(false);
        loginMessage.textContent = error.message || "Gagal menghubungi server.";
      } finally {
        refreshButton.disabled = false;
      }
    }

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      loginMessage.textContent = "";
      loginButton.disabled = true;
      try {
        const { response, data } = await api("login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: document.getElementById("password").value })
        });
        if (!response.ok) throw new Error(data.message || "Login gagal.");
        loginForm.reset();
        await loadContacts(false);
        showToast("Login berhasil.");
      } catch (error) {
        loginMessage.textContent = error.message || "Login gagal.";
      } finally {
        loginButton.disabled = false;
      }
    });

    contactsForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const contacts = {};
      for (const card of contactsGrid.querySelectorAll(".contact-card")) {
        contacts[card.dataset.key] = {
          url: card.querySelector('[data-role="url"]').value.trim(),
          active: card.querySelector('[data-role="active"]').checked
        };
      }

      saveButton.disabled = true;
      try {
        const { response, data } = await api("save", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contacts })
        });
        if (response.status === 401) {
          setView(false);
          throw new Error("Sesi berakhir. Silakan login kembali.");
        }
        if (!response.ok) throw new Error(data.message || "Perubahan gagal disimpan.");
        updateTimestamp(data.updatedAt);
        showToast("Semua perubahan berhasil disimpan.");
      } catch (error) {
        showToast(error.message || "Perubahan gagal disimpan.", true);
      } finally {
        saveButton.disabled = false;
      }
    });

    refreshButton.addEventListener("click", () => loadContacts(true));

    logoutButton.addEventListener("click", async () => {
      logoutButton.disabled = true;
      try { await api("logout", { method: "POST" }); } catch (_) {}
      setView(false);
      logoutButton.disabled = false;
      showToast("Anda sudah logout.");
    });

    loadContacts(false);
  </script>
</body>
</html>
